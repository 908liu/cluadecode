# 反向代理示例：前端静态文件与 FastAPI API 共用同一个域名
# 将前端构建目录和域名替换为实际值后使用。

server {
    listen 80;
    server_name example.com;

    # 50MB uploads + multipart overhead. Nginx defaults to 1MB.
    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /opt/app/frontend/dist;
    index index.html;

    # Vue Router History 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof the rate-limit key.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答必须关闭代理缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # 如需 HTTP Upgrade，可在 nginx.conf 的 http{} 中定义 connection_upgrade 映射
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
