[project]
name = "kb-backend"
version = "0.1.0"
description = "Multi-user document Q&A knowledge base backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "sqlalchemy>=2.0.36,<2.1",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "bcrypt>=4.2",
  "cryptography>=43",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "chromadb>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false
